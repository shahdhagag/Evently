name: evently
description: "Evently project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localization: ^0.3.3
  intl: any
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.8
  provider: ^6.1.5+1
  go_router: ^17.0.1
  gap: ^3.0.1
  smooth_page_indicator: ^2.0.1
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  google_sign_in: ^5.4.4
  icons_plus: ^5.0.0
  flutter_slidable: ^4.0.3
  cloud_firestore: ^6.1.2
  flutter_screenutil: ^5.9.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# =========================
# App Icon Configuration
# =========================
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/timetable.png"
  remove_alpha_ios: true

# =========================
# Splash Screen Configuration
# =========================
flutter_native_splash:
  image: assets/images/Evently.png
  color: "#ffffff"
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/translations/
    - assets/images/

